[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "fault-finder"
version = "0.1.0"
description = "Reproducible evidence for Python memory retention"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["memory", "profiling", "pytest", "retention", "diagnostics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11,<3.13"
dependencies = ["typer>=0.15,<1", "rich>=13,<15", "pydantic>=2.10,<3", "psutil>=6,<8", "jinja2>=3.1.6,<4", "httpx>=0.28,<1", "pytest>=9.0.3,<10", "pytest-asyncio>=1.3,<2"]

[project.urls]
Repository = "https://github.com/pratx08/fault-finder"
Issues = "https://github.com/pratx08/fault-finder/issues"

[project.scripts]
faultfinder = "faultfinder.cli:main"

[dependency-groups]
dev = ["ruff>=0.9", "mypy>=1.14", "types-psutil", "build>=1.2", "twine>=6,<7", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/faultfinder"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src", "tests", "pyproject.toml", "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md", "Dockerfile", "uv.lock", "tools/release_check.py", "tools/installed_smoke.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["docker: requires Docker with the faultfinder-worker image"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
